<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video, Audio, Media</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Download Clip-->
    <video src="./Assets/Academic Acers Intro.mp4" width="560" height="315" controls loop poster="https://marketplace.canva.com/EAF_MDLuAl8/3/0/1600w/canva-green-passive-income-ideas-youtube-thumbnail-ieZVlaB0J5A.jpg"></video>
    <video src="./Assets/Academic Acers Intro.mp4" width="560" height="315" controls autoplay muted ></video>
    
    <!-- Audio-->
    <!--
        Preload attribute:
        - none: The audio file will not be preloaded.
        - metadata: Only the metadata (information about the file) of the audio file will be preloaded. 
        - auto: The audio file will be preloaded automatically.

    -->
    <audio src="./Assets/Academic Acers Intro.mp4" width="560" height="315" controls preload="auto" ></audio>

    <!-- Media -->
    <svg height="100" width="100">
        <circle cx="50" cy="50" r="40" stroke="black" stroke-width="3" fill="red" />
    </svg>

    <svg xlmns="http://www.w3.ord/2000/svg" height="100" width="100">
        <circle cx="50" cy="50" r="40" stroke="orange" stroke-width="3" fill="purple" />
    </svg>

    <!-- iframe is used to embed stuffs like videos, websites-->
    
    <!-- Embedding YouTube Video-->
    <iframe width="560" height="315" src="https://www.youtube.com/embed/r_aMKEkEIf4?si=AdLxrgmC-EHo_X-P" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    <!-- Embedding Google Maps-->
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d203252.23621966693!2d77.17211014556759!3d32.49827805652337!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3904812723d6db55%3A0x6d9ec74f9b8c6205!2sAtal%20Tunnel!5e0!3m2!1sen!2sin!4v1747638631930!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>

</body>
</html>
