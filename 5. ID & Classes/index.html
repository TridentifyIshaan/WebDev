<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID & Classes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Defination list used to represent a list of terms along with their corresponding descriptions or definitions. The Definition List is created using the <dl> (Definition List) element, which wraps around one or more pairs of <dt> (Definition Term) and <dd> (Definition Description) elements. -->
    <dl>
        <dt>ID</dt>
        <dd>Unique identifier for an HTML element. It is used to apply styles or manipulate the element with JavaScript.</dd>
        <dt>Classes</dt>
        <dd>Used to group multiple elements together. Classes can be reused on multiple elements, allowing for shared styles.</dd>
    </dl>

    <div id="firstdiv" class="red bg-yellow">First</div> <!-- This element has 2 classes red and bg-yellow -->
    <span if="seconddiv" class="red">Second</span> <!-- ID is unique -->
</body>
</html>
