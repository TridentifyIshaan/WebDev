<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Properties</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Div is not an inline element that means it takes full width but we have set it as inline and hence so-->
    <div class="box box1">
        I am a box
    </div>
    <div class="box">
        I am another box
    </div>
    <!-- Span is an inline element -->
    <span>I am a good</span>
    <span>boy</span>
    <!-- mdn docs: https://developer.mozilla.org/en-US/docs/Web/CSS/display -->

</body>
</html>
