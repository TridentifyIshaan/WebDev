<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline and block elements</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <p>Hey I am a para</p> <!-- Block element -->
    <a href="http://google.com">Google</a> <!-- Inline element -->
    <div> I am a block element </div>
    <span> I am inline element</span>
    <a href="http://google.com">Google</a>

    We can also convert block to inline and inline to block using CSS but we will not go into that right now.
</body>
</html>
