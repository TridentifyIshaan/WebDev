<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <!-- First way of adding CSS to html file we have already learn. The second one is style tag-->
     <style>
        body {
            background-color:blanchedalmond;
        }
        /*Multiple selectors*/
        div, span {
            background-color: lightblue;
            padding: 10px;
            margin: 5px;
        }
     </style>
</head>
<body>
    <div></div>
    <br>
    <span></span>
</body>
</html>
